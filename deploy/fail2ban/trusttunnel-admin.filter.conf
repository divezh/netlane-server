# fail2ban filter for the Netlane Console panel (journal of trusttunnel-admin.service).
# Matches: "auth: login failed user=\"x\" ip=1.2.3.4", "auth: login rate limited ip=..."
# and "auth: password change rejected ip=...". Successful logins are never matched.
[Definition]
failregex = auth: (?:login failed user=".*"|login rate limited|password change rejected) ip=<HOST>$
ignoreregex =
journalmatch = _SYSTEMD_UNIT=trusttunnel-admin.service
